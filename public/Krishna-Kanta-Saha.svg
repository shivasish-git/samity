<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe" />
      <stop offset="40%" stop-color="#dbeafe" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <linearGradient id="terraceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e29f79" />
      <stop offset="45%" stop-color="#cf845e" />
      <stop offset="100%" stop-color="#aa633e" />
    </linearGradient>
    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#aa633e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#804120" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2725" />
      <stop offset="60%" stop-color="#181514" />
      <stop offset="100%" stop-color="#0d0b0a" />
    </linearGradient>
    <linearGradient id="beardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4441" />
      <stop offset="40%" stop-color="#d1d5db" />
      <stop offset="85%" stop-color="#f3f4f6" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="poloBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f242d" />
      <stop offset="40%" stop-color="#11151c" />
      <stop offset="100%" stop-color="#090b0e" />
    </linearGradient>
    <linearGradient id="poloShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background: Soft daytime cityscape with terrace glass rail & planter -->
  <rect width="400" height="500" fill="url(#skyGrad)" />
  
  <!-- Architectural city backdrop -->
  <g opacity="0.35">
    <rect x="20" y="30" width="70" height="120" fill="#cbd5e1" rx="3"/>
    <rect x="30" y="45" width="12" height="15" fill="#94a3b8"/>
    <rect x="50" y="45" width="12" height="15" fill="#94a3b8"/>
    <rect x="70" y="45" width="12" height="15" fill="#94a3b8"/>
    <rect x="30" y="70" width="12" height="15" fill="#94a3b8"/>
    <rect x="50" y="70" width="12" height="15" fill="#94a3b8"/>
    <rect x="70" y="70" width="12" height="15" fill="#94a3b8"/>
    <rect x="30" y="95" width="12" height="15" fill="#94a3b8"/>
    <rect x="50" y="95" width="12" height="15" fill="#94a3b8"/>
    <rect x="70" y="95" width="12" height="15" fill="#94a3b8"/>

    <rect x="280" y="20" width="100" height="150" fill="#94a3b8" rx="4"/>
    <rect x="295" y="35" width="20" height="18" fill="#e2e8f0"/>
    <rect x="325" y="35" width="20" height="18" fill="#e2e8f0"/>
    <rect x="355" y="35" width="15" height="18" fill="#e2e8f0"/>
    <rect x="295" y="65" width="20" height="18" fill="#e2e8f0"/>
    <rect x="325" y="65" width="20" height="18" fill="#e2e8f0"/>
    <rect x="355" y="65" width="15" height="18" fill="#e2e8f0"/>
    <!-- Red signage across street like photo -->
    <rect x="290" y="95" width="85" height="18" fill="#dc2626" rx="2" opacity="0.8"/>
  </g>

  <!-- Green terrace planter hedge behind subject -->
  <path d="M 0 135 C 40 125, 90 130, 140 128 C 190 126, 240 122, 290 125 C 340 128, 380 122, 400 125 L 400 190 L 0 190 Z" fill="#2d6a4f" opacity="0.85"/>
  <path d="M 10 132 C 60 122, 110 128, 160 124 C 220 120, 270 126, 320 122 C 360 120, 390 125, 400 123 L 400 160 L 0 160 Z" fill="#40916c" opacity="0.5"/>
  
  <!-- Glass balcony railing -->
  <line x1="0" y1="140" x2="400" y2="140" stroke="#94a3b8" stroke-width="4" stroke-opacity="0.8" />
  <rect x="0" y="142" width="400" height="60" fill="#93c5fd" fill-opacity="0.25"/>
  <line x1="0" y1="202" x2="400" y2="202" stroke="#64748b" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Outdoor Chair curved metal armrest (golden bronze tube) -->
  <path d="M 30 380 C 25 310, 45 280, 85 270" stroke="url(#goldRim)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 370 380 C 375 310, 355 280, 315 270" stroke="url(#goldRim)" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- Subject Body: Black Polo Shirt -->
  <g id="body">
    <!-- Torso -->
    <path d="M 90 330 C 85 270, 115 235, 155 230 L 245 230 C 285 235, 315 270, 310 330 L 335 480 C 335 495, 325 500, 310 500 L 90 500 C 75 500, 65 495, 65 480 Z" fill="url(#poloBlack)"/>
    <path d="M 100 290 C 130 250, 270 250, 300 290 L 315 480 L 85 480 Z" fill="url(#poloShine)"/>

    <!-- Arms -->
    <!-- Left Arm -->
    <path d="M 90 280 C 65 310, 50 360, 60 410 C 70 450, 110 460, 145 450 L 130 390 L 105 320 Z" fill="url(#skinGrad)"/>
    <!-- Left Sleeve -->
    <path d="M 115 240 C 95 255, 75 290, 75 325 C 90 335, 115 330, 125 320 L 135 255 Z" fill="url(#poloBlack)"/>
    <!-- Sleeve White Trim -->
    <path d="M 76 325 C 90 335, 115 330, 125 320" stroke="#f8fafc" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 78 320 C 92 330, 113 325, 123 316" stroke="#090b0e" stroke-width="1.5" fill="none"/>

    <!-- Right Arm -->
    <path d="M 310 280 C 335 310, 350 360, 340 410 C 330 450, 290 460, 255 450 L 270 390 L 295 320 Z" fill="url(#skinGrad)"/>
    <!-- Right Sleeve -->
    <path d="M 285 240 C 305 255, 325 290, 325 325 C 310 335, 285 330, 275 320 L 265 255 Z" fill="url(#poloBlack)"/>
    <!-- Sleeve White Trim -->
    <path d="M 324 325 C 310 335, 285 330, 275 320" stroke="#f8fafc" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 322 320 C 308 330, 287 325, 277 316" stroke="#090b0e" stroke-width="1.5" fill="none"/>

    <!-- Clasped Hands in Lap -->
    <g id="hands">
      <!-- Clasped Fingers & Palms -->
      <path d="M 140 420 C 145 395, 255 395, 260 420 C 265 455, 235 480, 200 480 C 165 480, 135 455, 140 420 Z" fill="url(#skinGrad)"/>
      <path d="M 155 425 C 175 410, 225 410, 245 425" stroke="#9a3412" stroke-width="2.5" fill="none" opacity="0.6"/>
      <path d="M 160 440 C 180 430, 220 430, 240 440" stroke="#9a3412" stroke-width="2" fill="none" opacity="0.6"/>
      <path d="M 170 455 C 185 450, 215 450, 230 455" stroke="#9a3412" stroke-width="2" fill="none" opacity="0.6"/>
    </g>

    <!-- Tommy Hilfiger Logo on Left Chest -->
    <g transform="translate(245, 295)">
      <rect x="0" y="0" width="16" height="10" rx="1.5" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
      <rect x="2" y="2" width="6" height="6" fill="#f8fafc"/>
      <rect x="8" y="2" width="6" height="6" fill="#dc2626"/>
      <line x1="2" y1="1" x2="14" y2="1" stroke="#0f172a" stroke-width="1"/>
      <line x1="2" y1="9" x2="14" y2="9" stroke="#0f172a" stroke-width="1"/>
    </g>

    <!-- Polo Collar and Placket -->
    <!-- Placket & Buttons -->
    <path d="M 190 230 L 210 230 L 206 310 L 194 310 Z" fill="#151b24"/>
    <circle cx="200" cy="255" r="3.5" fill="#334155" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="200" cy="280" r="3.5" fill="#334155" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Left Collar -->
    <path d="M 196 230 L 140 250 C 135 255, 142 275, 155 285 L 195 242 Z" fill="#1e2633"/>
    <!-- Collar White Twin Stripe -->
    <path d="M 140 252 C 145 272, 152 280, 155 283" stroke="#f8fafc" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 144 254 C 148 270, 153 277, 155 280" stroke="#090b0e" stroke-width="1" fill="none"/>

    <!-- Right Collar -->
    <path d="M 204 230 L 260 250 C 265 255, 258 275, 245 285 L 205 242 Z" fill="#1e2633"/>
    <!-- Collar White Twin Stripe -->
    <path d="M 260 252 C 255 272, 248 280, 245 283" stroke="#f8fafc" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 256 254 C 252 270, 247 277, 245 280" stroke="#090b0e" stroke-width="1" fill="none"/>

    <!-- Neck -->
    <path d="M 175 190 L 170 238 C 180 248, 220 248, 230 238 L 225 190 Z" fill="url(#skinGrad)"/>
    <path d="M 172 205 C 185 225, 215 225, 228 205 L 226 235 C 215 245, 185 245, 174 235 Z" fill="url(#skinShadow)"/>
  </g>

  <!-- Head & Facial Features -->
  <g id="head">
    <!-- Ears -->
    <ellipse cx="132" cy="175" rx="10" ry="18" fill="url(#skinGrad)" transform="rotate(-6 132 175)"/>
    <ellipse cx="268" cy="175" rx="10" ry="18" fill="url(#skinGrad)" transform="rotate(6 268 175)"/>

    <!-- Head Shape -->
    <path d="M 138 145 C 130 190, 140 230, 200 240 C 260 230, 270 190, 262 145 C 255 100, 145 100, 138 145 Z" fill="url(#skinGrad)"/>

    <!-- Salt and Pepper / White Beard & Mustache (Distinguished, trimmed full beard) -->
    <!-- Full jawline and cheek beard: predominantly snowy white / silver gray -->
    <path d="M 134 165 C 132 195, 142 245, 200 255 C 258 245, 268 195, 266 165 C 262 185, 255 210, 245 215 C 235 220, 225 218, 218 205 C 210 215, 190 215, 182 205 C 175 218, 165 220, 155 215 C 145 210, 138 185, 134 165 Z" fill="url(#beardGrad)"/>
    
    <!-- Beard texture strands (Silver & White highlights) -->
    <g stroke="#ffffff" stroke-width="1.8" opacity="0.8" stroke-linecap="round">
      <path d="M 142 185 C 144 205, 155 225, 175 235" />
      <path d="M 146 195 C 150 215, 165 235, 185 245" />
      <path d="M 258 185 C 256 205, 245 225, 225 235" />
      <path d="M 254 195 C 250 215, 235 235, 215 245" />
      <path d="M 188 238 C 195 248, 205 248, 212 238" />
      <path d="M 195 230 C 198 245, 202 245, 205 230" stroke="#9ca3af"/>
    </g>

    <!-- Mustache: Salt-and-pepper, dark in center, gray at edges -->
    <path d="M 172 196 C 182 190, 195 194, 200 198 C 205 194, 218 190, 228 196 C 232 204, 215 210, 200 207 C 185 210, 168 204, 172 196 Z" fill="#2b2624"/>
    <path d="M 174 198 C 182 194, 195 197, 200 200 C 205 197, 218 194, 226 198" stroke="#e5e7eb" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Mouth & Lips -->
    <path d="M 186 212 C 193 216, 207 216, 214 212" stroke="#88331d" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M 200 150 L 195 182 C 190 186, 210 186, 205 182 Z" fill="#be744e" opacity="0.4"/>
    <path d="M 192 182 C 195 186, 205 186, 208 182" stroke="#88331d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <ellipse cx="193" cy="183" rx="2.5" ry="1.5" fill="#5c2616"/>
    <ellipse cx="207" cy="183" rx="2.5" ry="1.5" fill="#5c2616"/>

    <!-- Eyes (Kind, respected gaze) -->
    <!-- Left Eye -->
    <ellipse cx="174" cy="155" rx="9" ry="5.5" fill="#ffffff"/>
    <circle cx="174" cy="155" r="4.2" fill="#2c1a0e"/>
    <circle cx="175" cy="153.5" r="1.5" fill="#ffffff"/>
    <path d="M 163 154 C 168 149, 180 149, 185 154" stroke="#4a1d0d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 165 161 C 171 163, 177 163, 183 161" stroke="#9a3412" stroke-width="1" fill="none" opacity="0.6"/>

    <!-- Right Eye -->
    <ellipse cx="226" cy="155" rx="9" ry="5.5" fill="#ffffff"/>
    <circle cx="226" cy="155" r="4.2" fill="#2c1a0e"/>
    <circle cx="227" cy="153.5" r="1.5" fill="#ffffff"/>
    <path d="M 215 154 C 220 149, 232 149, 237 154" stroke="#4a1d0d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 217 161 C 223 163, 229 163, 235 161" stroke="#9a3412" stroke-width="1" fill="none" opacity="0.6"/>

    <!-- Eyebrows (Dark with subtle silver gray flecks) -->
    <path d="M 162 143 C 170 137, 182 139, 187 144" stroke="#1f242d" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M 165 142 C 172 138, 180 140, 185 143" stroke="#9ca3af" stroke-width="1.2" fill="none"/>

    <path d="M 238 143 C 230 137, 218 139, 213 144" stroke="#1f242d" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M 235 142 C 228 138, 220 140, 215 143" stroke="#9ca3af" stroke-width="1.2" fill="none"/>

    <!-- Hair (Dark with slight brown sheen and neat forward fringe matching photo) -->
    <path d="M 136 142 C 132 110, 145 75, 200 70 C 255 75, 268 110, 264 142 C 260 115, 245 92, 200 90 C 155 92, 140 115, 136 142 Z" fill="url(#hairGrad)"/>
    <!-- Forward fringe strands over forehead -->
    <path d="M 148 108 C 160 120, 175 125, 190 122 C 205 120, 225 125, 245 112 C 235 122, 220 128, 200 126 C 180 128, 160 124, 148 108 Z" fill="#181514"/>
    <path d="M 160 110 C 170 118, 180 122, 192 120" stroke="#374151" stroke-width="2" fill="none"/>
    <path d="M 205 120 C 215 122, 225 120, 235 114" stroke="#374151" stroke-width="2" fill="none"/>
  </g>

  <!-- Title Badge overlay at bottom -->
  <g transform="translate(30, 435)">
    <rect x="0" y="0" width="340" height="52" rx="10" fill="#0f172a" fill-opacity="0.88" stroke="#3b82f6" stroke-width="1.5" filter="url(#softGlow)"/>
    <text x="170" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">
      Krishna Kanta Saha (Kesto Da)
    </text>
    <text x="170" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#60a5fa" text-anchor="middle">
      Chief Advisor • Bangiya Saha Samity
    </text>
  </g>
</svg>
