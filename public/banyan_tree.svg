<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="100%" height="100%">
  <defs>
    <!-- Canopy Gradients -->
    <radialGradient id="canopyTopLight" cx="45%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#80ed99" />
      <stop offset="40%" stop-color="#38b000" />
      <stop offset="75%" stop-color="#1f7a1f" />
      <stop offset="100%" stop-color="#0b5212" />
    </radialGradient>
    
    <radialGradient id="canopyLeft" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#55a630" />
      <stop offset="50%" stop-color="#2d6a4f" />
      <stop offset="100%" stop-color="#081c15" />
    </radialGradient>

    <radialGradient id="canopyRight" cx="60%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#70e000" />
      <stop offset="50%" stop-color="#386641" />
      <stop offset="100%" stop-color="#1b4332" />
    </radialGradient>

    <radialGradient id="canopyCenter" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#9ef01a" />
      <stop offset="35%" stop-color="#38b000" />
      <stop offset="70%" stop-color="#134611" />
      <stop offset="100%" stop-color="#05200a" />
    </radialGradient>

    <!-- Bark & Trunk Gradients -->
    <linearGradient id="barkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b2210" />
      <stop offset="20%" stop-color="#603813" />
      <stop offset="50%" stop-color="#855223" />
      <stop offset="75%" stop-color="#593212" />
      <stop offset="100%" stop-color="#2a1608" />
    </linearGradient>

    <linearGradient id="aerialRootGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c532b" />
      <stop offset="40%" stop-color="#936437" />
      <stop offset="70%" stop-color="#5a3715" />
      <stop offset="100%" stop-color="#3d230b" />
    </linearGradient>

    <linearGradient id="rootHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a67c52" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4a2800" stop-opacity="0.9" />
    </linearGradient>

    <!-- Undergrowth & Fern Gradients -->
    <radialGradient id="groundFlora" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#70e000" />
      <stop offset="50%" stop-color="#2d6a4f" />
      <stop offset="100%" stop-color="#081c15" />
    </radialGradient>

    <!-- Soft Drop Shadow Filter for Tree Depth -->
    <filter id="foliageShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#081c15" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- ================= BACKGROUND SHADOW & UNDER-BRANCHES ================= -->
  <g id="under-branches" opacity="0.9">
    <!-- Deep underside shadows of canopy -->
    <path d="M 80 240 Q 150 200 240 250 Q 320 210 400 240 Q 480 205 530 250 C 510 270 430 290 350 275 C 280 285 200 295 130 275 C 90 265 80 240 80 240 Z" fill="#081c15" />
    <path d="M 120 190 Q 200 160 300 185 Q 420 155 490 200 C 450 220 370 230 300 220 C 220 230 150 215 120 190 Z" fill="#0c2317" />
  </g>

  <!-- ================= MASSIVE BANYAN TRUNK & BOUGHS ================= -->
  <g id="trunk-and-boughs">
    <!-- Main Left Reaching Bough -->
    <path d="M 300 320 C 260 300 210 280 170 265 C 130 250 90 245 80 255 C 80 262 105 272 145 285 C 190 300 240 325 280 360 Z" fill="url(#barkGradient)" />
    <!-- Main Right Reaching Bough -->
    <path d="M 320 310 C 370 290 430 270 480 255 C 520 245 545 255 540 265 C 510 280 450 298 390 320 C 350 338 335 355 330 370 Z" fill="url(#barkGradient)" />

    <!-- Central Trunk Multi-Stem Fluting (Braided Banyan Structure) -->
    <!-- Far-left pillar stem -->
    <path d="M 230 460 C 235 400 245 350 270 320 C 260 330 250 380 240 460 Z" fill="#3b2210" />
    <path d="M 245 465 C 255 410 265 360 285 330 C 275 350 265 405 255 470 Z" fill="url(#barkGradient)" />

    <!-- Central Primary Core Trunk -->
    <path d="M 260 480 C 270 400 280 340 295 300 C 315 285 325 285 340 300 C 350 340 365 400 375 480 C 350 485 320 488 295 485 Z" fill="url(#barkGradient)" />
    <!-- Trunk vertical bark fissures / striations -->
    <path d="M 285 475 C 290 410 295 365 305 320" stroke="#2a1608" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 315 480 C 318 420 315 370 312 310" stroke="#1d0e05" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 335 475 C 330 415 332 360 325 315" stroke="#4a2800" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 350 478 C 345 430 348 375 340 335" stroke="#241105" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Trunk Highlights (Gives 3D wood volume) -->
    <path d="M 300 460 C 302 410 305 365 312 325" stroke="#a67c52" stroke-width="2" stroke-linecap="round" opacity="0.7" fill="none" />
    <path d="M 328 465 C 326 415 328 370 322 330" stroke="#ba8c5c" stroke-width="2" stroke-linecap="round" opacity="0.6" fill="none" />

    <!-- Far-right pillar stem -->
    <path d="M 390 465 C 380 405 370 360 345 325 C 355 350 368 400 375 465 Z" fill="url(#barkGradient)" />
    <path d="M 405 460 C 395 410 380 370 360 335 C 375 365 390 415 395 460 Z" fill="#2d1708" />

    <!-- Upper Trunk Division into Canopy Branches -->
    <path d="M 295 310 Q 250 250 220 220 Q 230 215 265 240 Q 295 270 310 295 Z" fill="url(#barkGradient)" />
    <path d="M 325 305 Q 360 250 400 215 Q 410 220 375 250 Q 345 275 330 300 Z" fill="url(#barkGradient)" />
    <path d="M 310 295 Q 315 230 318 180 Q 325 180 328 230 Q 325 275 320 295 Z" fill="url(#barkGradient)" />
  </g>

  <!-- ================= AERIAL PROP ROOTS (ঝুরি - Hanging Vines & Pillars) ================= -->
  <g id="aerial-prop-roots">
    <!-- Left Major Grounded Prop Roots -->
    <path d="M 140 275 Q 145 350 150 440" stroke="url(#aerialRootGradient)" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 148 280 Q 152 360 158 445" stroke="url(#aerialRootGradient)" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 175 270 Q 180 340 185 450" stroke="url(#aerialRootGradient)" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 183 275 Q 187 350 192 452" stroke="#a67c52" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M 205 285 Q 210 360 215 455" stroke="url(#aerialRootGradient)" stroke-width="5.5" stroke-linecap="round" fill="none" />
    
    <!-- Right Major Grounded Prop Roots -->
    <path d="M 470 265 Q 465 340 455 440" stroke="url(#aerialRootGradient)" stroke-width="5.5" stroke-linecap="round" fill="none" />
    <path d="M 462 270 Q 458 350 450 442" stroke="#a67c52" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M 435 275 Q 430 350 420 448" stroke="url(#aerialRootGradient)" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 405 290 Q 402 360 395 455" stroke="url(#aerialRootGradient)" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Delicate Hanging Aerial Tendrils (Signature Banyan Beard) -->
    <!-- Far Left Hanging Tendrils -->
    <path d="M 70 245 Q 72 290 73 340" stroke="#7a4d29" stroke-width="2" stroke-dasharray="80 3" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M 85 240 Q 88 300 89 360" stroke="#633917" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 98 250 Q 100 295 101 335" stroke="#8c5a2b" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 112 255 Q 115 320 116 380" stroke="#522d0d" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 125 260 Q 128 315 129 365" stroke="#7a4d29" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Mid Left Hanging Clusters -->
    <path d="M 160 270 Q 163 325 164 375" stroke="#603714" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 195 280 Q 198 340 199 395" stroke="#734319" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 225 290 Q 227 345 228 390" stroke="#542e0d" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Mid Right Hanging Clusters -->
    <path d="M 370 295 Q 368 350 366 400" stroke="#542e0d" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 385 290 Q 382 355 380 410" stroke="#7a4a21" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M 420 280 Q 417 335 415 385" stroke="#613814" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 445 275 Q 442 335 440 395" stroke="#734319" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Far Right Hanging Tendrils -->
    <path d="M 490 260 Q 488 320 486 375" stroke="#5c3412" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 505 255 Q 503 310 502 360" stroke="#7d4b20" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M 520 250 Q 519 300 518 345" stroke="#633917" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 535 245 Q 534 290 533 330" stroke="#875427" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.75" />
  </g>

  <!-- ================= LUSH CANOPY FOLIAGE (Layered Banyan Crown) ================= -->
  <g id="canopy-leaves" filter="url(#foliageShadow)">
    <!-- BACK / DEEP SHADOW LAYER -->
    <!-- Far Left Cloud -->
    <path d="M 40 220 C 25 190 40 160 70 150 C 65 125 90 105 120 110 C 130 90 160 80 185 95 C 205 75 245 75 265 100 C 275 80 305 70 330 85 C 360 65 400 70 420 95 C 445 80 480 90 495 115 C 520 110 550 130 555 160 C 580 170 590 205 575 230 C 585 255 565 285 535 280 C 510 295 470 285 450 270 C 420 285 370 280 340 265 C 310 280 260 280 230 265 C 200 285 150 285 120 270 C 95 285 60 275 45 250 C 35 240 38 230 40 220 Z" fill="#081c15" />

    <!-- MID LAYER: Forest Greens and Emerald Volumes -->
    <!-- Left Tier -->
    <path d="M 60 210 C 50 185 65 160 90 155 C 95 130 120 115 145 125 C 160 105 190 100 210 115 C 230 100 265 105 275 130 C 260 160 230 180 200 185 C 170 195 140 205 110 215 C 80 225 65 220 60 210 Z" fill="url(#canopyLeft)" />
    <!-- Outer Left Drooping Canopy -->
    <path d="M 45 225 C 35 205 45 185 68 180 C 72 160 95 150 115 158 C 128 140 152 138 168 150 C 185 138 212 142 220 162 C 208 185 185 202 160 206 C 135 215 110 222 88 230 C 62 238 50 235 45 225 Z" fill="#1b4332" />

    <!-- Right Tier -->
    <path d="M 550 210 C 560 185 545 160 520 155 C 515 130 490 115 465 125 C 450 105 420 100 400 115 C 380 100 345 105 335 130 C 350 160 380 180 410 185 C 440 195 470 205 500 215 C 530 225 545 220 550 210 Z" fill="url(#canopyRight)" />
    <!-- Outer Right Drooping Canopy -->
    <path d="M 565 225 C 575 205 565 185 542 180 C 538 160 515 150 495 158 C 482 140 458 138 442 150 C 425 138 398 142 390 162 C 402 185 425 202 450 206 C 475 215 500 222 522 230 C 548 238 560 235 565 225 Z" fill="#1b4332" />

    <!-- Center Upper Crown -->
    <path d="M 180 120 C 175 90 205 65 235 70 C 250 45 285 40 310 55 C 335 40 370 45 385 70 C 415 65 445 90 440 120 C 460 140 455 175 430 190 C 410 205 380 200 360 185 C 335 200 285 200 260 185 C 240 200 210 205 190 190 C 165 175 160 140 180 120 Z" fill="url(#canopyCenter)" />

    <!-- FOREGROUND / HIGHLIGHT CANOPY PUFFS (Sunlit Leaf Detail) -->
    <!-- Top Central Sunlit Leaves -->
    <circle cx="280" cy="80" r="30" fill="url(#canopyTopLight)" />
    <circle cx="320" cy="75" r="32" fill="url(#canopyTopLight)" />
    <circle cx="355" cy="85" r="28" fill="url(#canopyTopLight)" />
    <circle cx="245" cy="95" r="26" fill="url(#canopyTopLight)" />
    <circle cx="385" cy="100" r="27" fill="url(#canopyTopLight)" />

    <!-- Mid-Level Leaf Clusters with Depth -->
    <ellipse cx="210" cy="130" rx="35" ry="25" fill="#52b788" opacity="0.9" />
    <ellipse cx="270" cy="120" rx="40" ry="28" fill="#40916c" />
    <ellipse cx="330" cy="115" rx="42" ry="28" fill="#52b788" />
    <ellipse cx="390" cy="125" rx="38" ry="26" fill="#40916c" />
    <ellipse cx="450" cy="135" rx="35" ry="25" fill="#52b788" opacity="0.9" />

    <!-- Left Flank Leaf Clusters -->
    <ellipse cx="140" cy="145" rx="32" ry="24" fill="#40916c" />
    <ellipse cx="100" cy="170" rx="30" ry="22" fill="#52b788" />
    <ellipse cx="70" cy="195" rx="28" ry="20" fill="#2d6a4f" />
    <ellipse cx="125" cy="190" rx="32" ry="22" fill="#52b788" />
    <ellipse cx="170" cy="175" rx="35" ry="24" fill="#40916c" />

    <!-- Right Flank Leaf Clusters -->
    <ellipse cx="480" cy="145" rx="32" ry="24" fill="#40916c" />
    <ellipse cx="515" cy="170" rx="30" ry="22" fill="#52b788" />
    <ellipse cx="545" cy="195" rx="28" ry="20" fill="#2d6a4f" />
    <ellipse cx="490" cy="190" rx="32" ry="22" fill="#52b788" />
    <ellipse cx="445" cy="175" rx="35" ry="24" fill="#40916c" />

    <!-- Lower Canopy Drooping Leaf Clusters (Overhanging branches) -->
    <ellipse cx="150" cy="235" rx="30" ry="18" fill="#2d6a4f" />
    <ellipse cx="210" cy="245" rx="35" ry="20" fill="#386641" />
    <ellipse cx="270" cy="240" rx="35" ry="18" fill="#2d6a4f" />
    <ellipse cx="340" cy="240" rx="35" ry="18" fill="#2d6a4f" />
    <ellipse cx="400" cy="245" rx="35" ry="20" fill="#386641" />
    <ellipse cx="460" cy="235" rx="30" ry="18" fill="#2d6a4f" />

    <!-- Fine Leaf Highlights (Sun sparkles on leaves) -->
    <circle cx="295" cy="65" r="8" fill="#b7e4c7" opacity="0.8" />
    <circle cx="335" cy="62" r="7" fill="#b7e4c7" opacity="0.8" />
    <circle cx="230" cy="85" r="6" fill="#95d5b2" opacity="0.8" />
    <circle cx="370" cy="78" r="6.5" fill="#95d5b2" opacity="0.8" />
    <circle cx="160" cy="125" r="6" fill="#74c69d" opacity="0.85" />
    <circle cx="440" cy="120" r="6" fill="#74c69d" opacity="0.85" />
  </g>

  <!-- ================= BASE UNDERGROWTH, FERNS & MOSSY GROUND ================= -->
  <g id="ground-and-ferns">
    <!-- Ground Soil & Mound Base -->
    <path d="M 160 480 C 190 465 240 460 300 462 C 360 460 410 465 440 480 C 460 490 440 510 390 515 C 330 520 270 520 210 515 C 160 510 140 490 160 480 Z" fill="#241407" />
    <path d="M 180 485 C 220 472 270 468 310 469 C 350 468 390 472 420 485 C 400 498 350 505 310 505 C 270 505 210 498 180 485 Z" fill="#3d220a" />

    <!-- Lush Green Base Ferns & Tropical Shrubbery -->
    <!-- Left Fern Clumps -->
    <path d="M 170 475 Q 150 445 130 440 Q 155 455 175 480 Z" fill="#52b788" />
    <path d="M 185 470 Q 165 435 150 425 Q 170 445 190 475 Z" fill="#74c69d" />
    <path d="M 200 472 Q 185 440 175 430 Q 190 450 205 478 Z" fill="#2d6a4f" />
    <path d="M 215 475 Q 205 445 200 435 Q 210 455 220 480 Z" fill="#40916c" />

    <!-- Center Low Undergrowth -->
    <ellipse cx="250" cy="485" rx="28" ry="14" fill="#2d6a4f" />
    <ellipse cx="285" cy="488" rx="25" ry="12" fill="#52b788" />
    <ellipse cx="320" cy="488" rx="26" ry="12" fill="#74c69d" />
    <ellipse cx="355" cy="485" rx="28" ry="14" fill="#2d6a4f" />

    <!-- Right Fern Clumps -->
    <path d="M 430 475 Q 450 445 470 440 Q 445 455 425 480 Z" fill="#52b788" />
    <path d="M 415 470 Q 435 435 450 425 Q 430 445 410 475 Z" fill="#74c69d" />
    <path d="M 400 472 Q 415 440 425 430 Q 410 450 395 478 Z" fill="#2d6a4f" />
    <path d="M 385 475 Q 395 445 400 435 Q 390 455 380 480 Z" fill="#40916c" />

    <!-- Wild Broadleaf Plants at the base (as in image) -->
    <!-- Large Left Broadleaf -->
    <path d="M 205 480 C 185 460 160 460 145 470 C 165 475 185 485 205 488 Z" fill="#40916c" />
    <path d="M 210 485 C 195 470 170 472 158 480 C 175 485 195 490 210 492 Z" fill="#52b788" />
    <!-- Large Right Broadleaf -->
    <path d="M 395 480 C 415 460 440 460 455 470 C 435 475 415 485 395 488 Z" fill="#40916c" />
    <path d="M 390 485 C 405 470 430 472 442 480 C 425 485 405 490 390 492 Z" fill="#52b788" />

    <!-- Moss and Small Yellow-Green Spores/Flowers -->
    <circle cx="230" cy="488" r="3.5" fill="#d9ed92" />
    <circle cx="240" cy="492" r="3" fill="#b5e48c" />
    <circle cx="270" cy="494" r="4" fill="#d9ed92" />
    <circle cx="340" cy="494" r="3.5" fill="#d9ed92" />
    <circle cx="370" cy="491" r="3" fill="#b5e48c" />
    <circle cx="380" cy="488" r="3.5" fill="#d9ed92" />
  </g>
</svg>
