    <script>
      (function() {
        try {
          var _rawFetch = window.fetch;
          var _currentFetch = _rawFetch;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') ||
                     (typeof Window !== 'undefined' && Window.prototype ? Object.getOwnPropertyDescriptor(Window.prototype, 'fetch') : null);
          
          if (!desc || !desc.set || !desc.writable) {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _currentFetch;
              },
              set: function(val) {
                _currentFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Fail-safe
        }

        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('Cannot set property fetch') !== -1) {
            event.preventDefault();
            if (typeof event.stopPropagation === 'function') {
              event.stopPropagation();
            }
            return true;
          }
        }, true);
      })();
    </script>
